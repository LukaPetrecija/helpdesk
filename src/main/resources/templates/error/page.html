<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${heading})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="container narrow">
    <div class="card">
        <p class="muted" th:text="'Error ' + ${status}">Error 404</p>
        <h1 th:text="${heading}">Not found</h1>
        <p th:text="${message}">Message</p>
        <a class="btn btn-primary" th:href="@{/tickets}">Back to tickets</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
